name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Upload the APK before lint and tests so a style or coverage failure
      # still leaves an installable build to try on a phone.
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Parser and domain tests (JVM, fast)
        run: ./gradlew :core:parser:test :core:domain:test

      - name: Android unit tests (Room via Robolectric)
        run: ./gradlew testDebugUnitTest

      - name: Coverage report and 80% gate
        run: ./gradlew koverXmlReport koverHtmlReport koverVerify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/reports/kover/
